services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realtime-code-studio-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      DATABASE_URL: sqlite:///leaderboard.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./backend/instance:/app/instance

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_FIREBASE_API_KEY: "AIzaSyAB_7oB8NfVzlXvN7NtE2WQmv3r8b7FoOo"
        VITE_FIREBASE_AUTH_DOMAIN: "codecollab-9be10.firebaseapp.com"
        VITE_FIREBASE_DATABASE_URL: "https://codecollab-9be10-default-rtdb.asia-southeast1.firebasedatabase.app"
        VITE_FIREBASE_PROJECT_ID: "codecollab-9be10"
        VITE_FIREBASE_STORAGE_BUCKET: "codecollab-9be10.firebasestorage.app"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "427908750984"
        VITE_FIREBASE_APP_ID: "1:427908750984:web:c20a04719fbe816b9b093d"
        VITE_FIREBASE_MEASUREMENT_ID: "G-QV54R3PDBY"
    container_name: realtime-code-studio-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_FIREBASE_API_KEY: "AIzaSyAB_7oB8NfVzlXvN7NtE2WQmv3r8b7FoOo"
      VITE_FIREBASE_AUTH_DOMAIN: "codecollab-9be10.firebaseapp.com"
      VITE_FIREBASE_DATABASE_URL: "https://codecollab-9be10-default-rtdb.asia-southeast1.firebasedatabase.app"
      VITE_FIREBASE_PROJECT_ID: "codecollab-9be10"
      VITE_FIREBASE_STORAGE_BUCKET: "codecollab-9be10.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "427908750984"
      VITE_FIREBASE_APP_ID: "1:427908750984:web:c20a04719fbe816b9b093d"
      VITE_FIREBASE_MEASUREMENT_ID: "G-QV54R3PDBY"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
